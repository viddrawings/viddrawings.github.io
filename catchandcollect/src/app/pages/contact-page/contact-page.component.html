<div class="container">
  <div class="page__hero">
    <h1 class="page__hero-title">CONTACT</h1>
  </div>

  <div class="section">
    <div class="section__content">
      <div class="section__text">
        <form [formGroup]="form" (ngSubmit)="onSubmit()" class="contact-form mat-elevation-z4">
          <h2>Contacteer ons</h2>

          <mat-form-field appearance="fill">
            <mat-label>Naam</mat-label>
            <input matInput formControlName="naam" required>
          </mat-form-field>

          <mat-form-field appearance="fill">
            <mat-label>E-mailadres</mat-label>
            <input matInput formControlName="email" type="email" required>
          </mat-form-field>

          <mat-form-field appearance="fill">
            <mat-label>Bericht</mat-label>
            <textarea matInput formControlName="bericht" rows="5" required></textarea>
          </mat-form-field>

          <button mat-raised-button color="primary" type="submit" [disabled]="loading">Verzenden</button>

          <p *ngIf="success" class="success">Bericht verzonden!</p>
          <p *ngIf="error" class="error">Er is iets fout gegaan.</p>
        </form>
      </div>
    </div>
  </div>
</div>
